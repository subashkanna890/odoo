<svg width="240" height="380" viewBox="0 0 240 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Main Invoice Card Clipping Right Edge -->
    <rect x="25" y="20" width="220" height="340" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.2"/>
    
    <!-- Title & Overdue Notice -->
    <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#111827">Invoice</text>
    
    <g transform="translate(50, 70)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#EF4444">2 overdue</text>
      <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#111827">$20,000.00</text>
    </g>

    <!-- Draft pill badge -->
    <rect x="50" y="125" width="46" height="20" rx="4" fill="#F3F4F6"/>
    <text x="59" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#4B5563">Draft</text>

    <!-- Client pays row -->
    <text x="50" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#6B7280">Client pays</text>
    <rect x="50" y="185" width="165" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="65" cy="200" r="6" fill="#1E40AF"/>
    <text x="78" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1E293B">EUR</text>

    <!-- I receive row -->
    <text x="50" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#6B7280">I receive</text>
    <rect x="50" y="245" width="165" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="65" cy="260" r="6" fill="#2563EB"/>
    <text x="78" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1E293B">USDC</text>

    <!-- Deposits same day -->
    <text x="50" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#9CA3AF">✓ Deposits same day</text>
  </g>

  <!-- Cyan Circular Badge Overlapping Card -->
  <g transform="translate(0, 50)" filter="url(#invRefShadow)">
    <circle cx="30" cy="30" r="28" fill="#0EA5E9"/>
    <!-- Transfer / Exchange Loop Icon -->
    <path d="M22 25C22 21 26 18 30 18C34 18 38 21 38 25M38 35C38 39 34 42 30 42C26 42 22 39 22 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <polyline points="35 22 38 25 35 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="25 32 22 35 25 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
