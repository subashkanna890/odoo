<svg width="180" height="70" viewBox="0 0 180 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="penShadow" x="-10%" y="-10%" width="130%" height="150%">
      <feDropShadow dx="-2" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="penBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="penChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-32 90 35)" filter="url(#penShadow)">
    <!-- Pen Barrel -->
    <rect x="25" y="28" width="115" height="12" rx="3" fill="url(#penBody)"/>
    <!-- Grip Knurling/Pattern -->
    <line x1="45" y1="28" x2="45" y2="40" stroke="#94A3B8" stroke-width="1"/>
    <line x1="50" y1="28" x2="50" y2="40" stroke="#94A3B8" stroke-width="1"/>
    <line x1="55" y1="28" x2="55" y2="40" stroke="#94A3B8" stroke-width="1"/>
    <line x1="60" y1="28" x2="60" y2="40" stroke="#94A3B8" stroke-width="1"/>

    <!-- Chrome Ring -->
    <rect x="110" y="27" width="5" height="14" rx="1" fill="url(#penChrome)"/>

    <!-- End Cap -->
    <rect x="140" y="29" width="18" height="10" rx="3" fill="url(#penChrome)"/>

    <!-- Pen Tip Cone -->
    <path d="M25 28 L5 34 L25 40 Z" fill="url(#penChrome)"/>
    <!-- Tungsten Carbide Ball Tip -->
    <circle cx="5" cy="34" r="1.5" fill="#1E293B"/>

    <!-- Pocket Clip -->
    <rect x="105" y="25" width="40" height="3" rx="1.5" fill="url(#penChrome)"/>
  </g>
</svg>
