<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#fde2f3"/>
    </linearGradient>
    <clipPath id="clip"><rect width="400" height="540" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- sky -->
    <rect width="400" height="540" fill="url(#sky)"/>

    <!-- sun (gentle pulse) -->
    <circle cx="290" cy="150" r="46" fill="#ffd9a0">
      <animate attributeName="r" values="46;50;46" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting clouds -->
    <g fill="#fff" opacity=".9">
      <g>
        <ellipse cx="90" cy="110" rx="50" ry="16"/><ellipse cx="120" cy="98" rx="30" ry="14"/>
        <animateTransform attributeName="transform" type="translate" values="-30 0;60 0;-30 0" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="80" cy="250" rx="44" ry="13"/><ellipse cx="104" cy="240" rx="24" ry="11"/>
        <animateTransform attributeName="transform" type="translate" values="40 0;-30 0;40 0" dur="18s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="320" cy="300" rx="40" ry="12"/><ellipse cx="338" cy="291" rx="22" ry="10"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-50 0;0 0" dur="16s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- dotted flight path -->
    <path d="M-40 360 Q150 300 440 120" stroke="#6a5cff" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round" fill="none" opacity=".7"/>

    <!-- paper plane flying along the path -->
    <g>
      <g>
        <path d="M-34 -16 L34 0 L-34 16 L-20 0Z" fill="#ffffff"/>
        <path d="M-20 0 L34 0 L-34 16Z" fill="#c9c2ff"/>
        <path d="M-34 -16 L-20 0 L-34 16" fill="#e3dfff"/>
        <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M-40 360 Q150 300 440 120" keyTimes="0;1" keyPoints="0;1" calcMode="linear"/>
    </g>

    <!-- layered waves (slowly swaying) -->
    <path d="M-60 420 Q40 360 140 410 T340 390 T540 400 V540H-60Z" fill="#8f9bff">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 4;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-60 460 Q60 410 170 455 T390 440 T560 450 V540H-60Z" fill="#6a5cff">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 -4;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M-60 500 Q50 465 160 495 T380 485 T560 492 V540H-60Z" fill="#3b2fc9">
      <animateTransform attributeName="transform" type="translate" values="0 0;-25 3;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
