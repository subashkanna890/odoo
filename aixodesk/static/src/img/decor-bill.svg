<svg width="260" height="150" viewBox="0 0 260 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="billBaseRef" x1="0" y1="0" x2="240" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAF8"/>
      <stop offset="50%" stop-color="#EEF4EF"/>
      <stop offset="100%" stop-color="#E2EBE4"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-6 130 75)">
    <!-- Banknote Body -->
    <rect x="15" y="15" width="230" height="115" rx="5" fill="url(#billBaseRef)" stroke="#97B89E" stroke-width="1.2"/>
    <!-- Fine Intaglio Border Pattern -->
    <rect x="20" y="20" width="220" height="105" rx="3" fill="none" stroke="#254F2E" stroke-width="1" stroke-dasharray="3 1.5"/>
    <rect x="23" y="23" width="214" height="99" rx="2" fill="none" stroke="#254F2E" stroke-width="0.5"/>

    <!-- Numbers -->
    <text x="30" y="44" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="900" fill="#1C4225">100</text>
    <text x="192" y="112" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="900" fill="#1C4225">100</text>

    <!-- Center Vignette / Portrait Oval -->
    <ellipse cx="132" cy="72" rx="26" ry="32" fill="#E2EFE4" stroke="#254F2E" stroke-width="1"/>
    <ellipse cx="132" cy="72" rx="22" ry="28" fill="none" stroke="#254F2E" stroke-width="0.5" stroke-dasharray="2 2"/>
    <path d="M124 64C124 58 138 58 138 64C138 72 126 76 130 84" stroke="#1C4225" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="132" cy="88" r="1.5" fill="#1C4225"/>

    <!-- Banknote Details -->
    <text x="76" y="36" font-family="serif" font-size="7.5" font-weight="700" letter-spacing="1.5px" fill="#254F2E">FEDERAL RESERVE NOTE</text>
    <text x="30" y="60" font-family="'Courier New', Courier, monospace" font-size="8" font-weight="700" fill="#2E633B">PF 93594443 E</text>
    <text x="30" y="70" font-family="'Courier New', Courier, monospace" font-size="7" font-weight="600" fill="#6B7280">F6</text>
  </g>
