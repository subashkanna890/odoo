<svg width="220" height="420" viewBox="0 0 220 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Document Sheet Clipping Left Edge -->
    <rect x="-10" y="20" width="135" height="380" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Document Header & Text lines -->
    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#9CA3AF">AMOUNT</text>
    <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1F2937">$12,800.00</text>
    
    <line x1="12" y1="85" x2="105" y2="85" stroke="#F3F4F6" stroke-width="1.5"/>
    <text x="12" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4B5563">2,800.00</text>
    
    <!-- Fine lines simulating line items -->
    <line x1="12" y1="130" x2="90" y2="130" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="12" y1="145" x2="70" y2="145" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="12" y1="160" x2="85" y2="160" stroke="#E5E7EB" stroke-width="1.5"/>
    <line x1="12" y1="175" x2="60" y2="175" stroke="#E5E7EB" stroke-width="1.5"/>
    
    <!-- Status Dot -->
    <circle cx="18" cy="220" r="4.5" fill="#10B981"/>
    <circle cx="18" cy="245" r="4.5" fill="#EF4444"/>

    <!-- Barcode / serial strip at bottom edge -->
    <text x="12" y="360" font-family="monospace" font-size="7" fill="#9CA3AF" transform="rotate(-90 12 360)">3AY708420</text>
  </g>

  <!-- Pinned Green Workflow / Token Symbol (Teal polygon) -->
  <g transform="translate(95, 110) rotate(-15)">
    <rect width="36" height="36" rx="8" fill="#14B8A6" filter="url(#docShadow)"/>
    <path d="M11 18H25M18 11V25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
