<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Terracotta / Warm Orange Binder Block Gradient -->
    <linearGradient id="binderOrange" x1="50" y1="60" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D95726"/>
      <stop offset="40%" stop-color="#BF4417"/>
      <stop offset="80%" stop-color="#9C320C"/>
      <stop offset="100%" stop-color="#7B2306"/>
    </linearGradient>
    <linearGradient id="binderBevel" x1="50" y1="60" x2="160" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F27749"/>
      <stop offset="100%" stop-color="#BF4417"/>
    </linearGradient>
    <!-- Silver Steel Wire Handle Gradient -->
    <linearGradient id="wireSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <g transform="rotate(22 110 110)">
    <!-- Binder Clip Body (Warm Terracotta / Orange) -->
    <rect x="70" y="76" width="72" height="84" rx="4" fill="url(#binderOrange)"/>
    <rect x="70" y="76" width="72" height="7" rx="2" fill="url(#binderBevel)"/>
    <line x1="74" y1="96" x2="138" y2="96" stroke="#5A1904" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="72" y1="120" x2="140" y2="120" stroke="#5A1904" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Wire Handles pointing upward -->
    <path d="M84 76 C84 32, 128 32, 128 76" fill="none" stroke="url(#wireSilver)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M86 76 C86 38, 126 38, 126 76" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Small silver paperclip attached -->
    <g transform="translate(48, 88) rotate(-40)">
      <path d="M10 38 V14 C10 7, 24 7, 24 14 V46 C24 55, 6 55, 6 46 V18 C6 13, 15 13, 15 18 V40" 
            fill="none" stroke="url(#wireSilver)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
