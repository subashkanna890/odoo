<svg width="200" height="30" viewBox="0 0 200 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hdLogoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <g transform="translate(0, 0)">
    <!-- 3 Sound Rays -->
    <line x1="30" y1="3" x2="30" y2="0.5" stroke="url(#hdLogoBlueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="5" x2="36" y2="3" stroke="url(#hdLogoBlueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="8.5" x2="40.5" y2="8.5" stroke="url(#hdLogoBlueGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Headset Headband -->
    <path d="M 8.5 15 C 8.5 7 14.5 3.5 21.5 3.5 C 28.5 3.5 34.5 7 34.5 15" stroke="url(#hdLogoBlueGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Left Ear Pad -->
    <rect x="3" y="14.5" width="4.5" height="10" rx="2.25" fill="url(#hdLogoBlueGrad)"/>
    <rect x="7" y="15" width="2" height="9" rx="1" fill="url(#hdLogoBlueGrad)"/>

    <!-- Right Ear Pad -->
    <rect x="33.5" y="15" width="2" height="9" rx="1" fill="url(#hdLogoBlueGrad)"/>
    <rect x="35" y="14.5" width="4.5" height="10" rx="2.25" fill="url(#hdLogoBlueGrad)"/>

    <!-- Central Chat Bubble with Transparent Dots -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 14 10.5 C 11.5 10.5 10 12 10 14.5 L 10 19 C 10 21.5 11.5 23 14 23 L 14 26.5 L 17.5 23 L 28.5 23 C 31 23 32.5 21.5 32.5 19 L 32.5 14.5 C 32.5 12 31 10.5 28.5 10.5 Z M 16 15.8 A 1.2 1.2 0 1 0 16 18.2 A 1.2 1.2 0 1 0 16 15.8 Z M 21 15.8 A 1.2 1.2 0 1 0 21 18.2 A 1.2 1.2 0 1 0 21 15.8 Z M 26 15.8 A 1.2 1.2 0 1 0 26 18.2 A 1.2 1.2 0 1 0 26 15.8 Z" fill="url(#hdLogoBlueGrad)"/>

    <!-- Microphone Boom &amp; Capsule -->
    <path d="M 34.5 22.5 C 34.5 27 28.5 28.5 23 28" stroke="url(#hdLogoBlueGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <rect x="17" y="26.5" width="6" height="3" rx="1.5" fill="url(#hdLogoBlueGrad)"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="48" y="20.5" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" letter-spacing="0.5">
    <tspan fill="#111827">HELP</tspan><tspan fill="url(#hdLogoBlueGrad)">DESK</tspan>
  </text>
</svg>